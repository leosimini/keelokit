# Keelokit's own CI: the plugin's unit tests, its manifests, and the template rendered for each app
# mix and run through the generated project's full `pnpm verify --all`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (doctor, guard, verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the release tags, for tests/test_release.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # tests/test_verify.py asks the real pnpm which packages the template's verify.sh selects.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # tests/test_copier.py renders copier.yml's defaults with copier's own Jinja (uv run --with).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # tests/test_dashboard.py lays both dashboard pages out in Chromium at 320/768/1280 px (UI-1).
      - run: pip install playwright==1.63.0 && python3 -m playwright install --with-deps chromium
      - run: python3 -m unittest discover -s tests -v

  # SEC-1: no secret anywhere in the history (.gitleaks.toml leaves out the guard tests' fake keys).
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI (free), not gitleaks-action (needs a paid license on organisation repos).
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --no-banner --config /repo/.gitleaks.toml /repo

  # Keelokit runs on its own harness (.keelokit/): the doctor checks that every house rule still has a
  # working check — CTX-1, TRACE-1, INV-1, CRIT-1, QA-1 — the same way it does in a generated project.
  checks:
    name: Harness doctor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main: the doctor counts a story done only from main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # What `git config core.hooksPath .githooks` does once in a clone (AGENTS.md), so the git-hook checks see the hooks.
      - run: git config core.hooksPath .githooks
      - run: python3 .keelokit/bin/doctor.py --ci

  # SAST-1: static analysis of the Python the plugin runs on people's machines, and of secrets.
  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.178.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: semgrep scan --config p/python --config p/secrets --error --metrics=off

  manifests:
    name: Plugin manifests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python3 - <<'EOF'
          import glob, json
          for path in [*glob.glob(".claude-plugin/*.json"), "hooks/hooks.json"]:
              json.load(open(path))
              print("ok", path)
          # The version only changes in a release commit, which also dates its CHANGELOG entry.
          version = json.load(open(".claude-plugin/plugin.json"))["version"]
          assert f"\n## {version} — " in open("CHANGELOG.md").read(), f"CHANGELOG.md has no entry for {version}"
          print("ok CHANGELOG.md", version)
          EOF
      # The zip every release attaches (keelokit-plugin.zip): the manifest at its root, only the plugin inside.
      - run: scripts/package.sh HEAD dist/keelokit-plugin.zip

  template:
    name: Template (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api+web, apps: '["api","web"]' }
          - { name: mobile, apps: '["mobile"]' }
          - { name: site, apps: '["site"]' }
          - { name: all apps + PostGIS, apps: '["api","web","mobile","site"]', flags: --postgis }
          - { name: adopt, flags: --adopt }
          # An upgrade from the last release that changed the template, with the CHANGELOG's manual
          # steps (docs/releasing.md step 6; tests/test_release.py fails until it is moved).
          - { name: update from v0.9.1, apps: '["api","web","mobile"]', flags: --update-from v0.9.1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, for --update-from and copier's version detection
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: git config --global user.name ci && git config --global user.email ci@localhost
      - run: scripts/test-template.sh '${{ matrix.apps }}' ${{ matrix.flags }}
