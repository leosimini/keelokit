[gates]
intake = "2026-09-28"
adopt = "2026-09-28"
backlog = "2026-09-28"

[dashboard]
lang = "es"
url = "https://claude.ai/artifact/UQSFizBPxuGyU1V9Yjy9BM"

[run]
mode = "auto"        # Leo delegated coordination and decisions to the coordinator session (2026-11-23):
                     # it goes on alone and stops only where a person is required (see docs/ledger.md)
build = "serial"     # one story at a time: most stories touch the guard, the doctor or the dashboard
decided = "2026-09-28"

[ledger]
# `check` requires attribution on the trunk commits after this one (it is exclusive). It was d0a13e2, the merge
# of the ledger's merge-attribution fix (#19): before it, main holds hand-made history, the ESC-090 junk commits
# and trailers written outside the last paragraph; corrections (backfill) cover what matters there. It moved to
# the release commit of 0.15.0, which scripts/release.sh wrote without a trailer (ESC-186) and which no correction
# row can attribute (rows name stories); d0a13e2..222faf1 had no error when it moved.
since = "222faf179665c92628473de9733b839c47c9a533"
# This repo's CI has no ledger-config/ledger-snapshot jobs (LEDGER-011 put them in the template only), so there is no
# keelokit/ledger branch to read: the snapshot is off, and LEDGER-1 doesn't ask for its jobs (LEDGER-012).
snapshot = ""

[ledger.approval]
# Leo, 2026-11-24, in chat: "Apruebo todo lo de las correcciones que necesitás … Quiero que avances sin
# restricciones." Correction rows are approved by the delegated review (two judges and a skeptic,
# workflows/ledger-review-flow.js); a doubtful row stays pending. Leo can still send a run back with
# `ledger.py review --reject-sample <run>`.
mode = "delegated"
sample = 0.05
